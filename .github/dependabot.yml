# Dependabot version-update configuration (the library standard's, copied from
# effect-drizzle-ext, whose grouping and cooldown this mirrors).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set; the vitest toolchain is pinned to
# vite-plus's exact versions (see pnpm-workspace.yaml) and is bumped by hand as
# a set, so its *version* updates are ignored while SECURITY updates stay
# enabled (the ignore is scoped to the `version-update:semver-*` update types;
# a bare `dependency-name` ignore would block security updates too).
#
# `@effect/tsgo`, `@typescript/native` (TS7) and `typescript` (the TS6 alias)
# are one set too: the root `prepare` script's `effect-tsgo patch` matches the
# native `tsc` and `oxlint` by gitHead / version and hard-errors on any pairing
# it has no artifact for, so a Dependabot PR moving one of them alone goes red.
# They move by hand, together with `vite-plus`, after checking the `components`
# table in `node_modules/@effect/tsgo/dist/effect-tsgo.cjs`. Their *version*
# updates are ignored the same way (security updates stay enabled), and
# `@effect/tsgo` is excluded from the `effect` group's `@effect/*` pattern.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      svelte:
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "vite-plus"
    ignore:
      - dependency-name: "@effect/tsgo"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "typescript"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@typescript/native"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    # The composite setup action pins actions too; list it explicitly.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
