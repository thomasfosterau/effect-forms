# Dependabot version updates for the pnpm workspace (the `npm` ecosystem at
# `/` reads pnpm-workspace.yaml's catalogs and the lockfile) and the GitHub
# Actions, including the local composite setup action's SHA pins.
#
# Groups exist only for dependencies that MUST move together, so they arrive
# in ONE PR; everything else gets a PR of its own. Dependabot puts a
# dependency in the FIRST group that matches it, with `exclude-patterns` where
# a broader pattern would otherwise catch a lockstep member:
#
# - `toolchain`: `vite-plus` pins the `vite` core, `vitest`, `oxlint`, `oxfmt`
#   and `oxlint-tsgolint` it carries (and `@vitest/coverage-istanbul` must equal
#   that vitest); the root `prepare` script's `effect-tsgo patch` matches the
#   native `tsc` (`@typescript/native`) and that oxlint / tsgolint by version
#   and hard-errors on any pairing it has no artifact for. A PR moving one
#   alone goes red, so every update type (major included) is grouped. Read the
#   catalog comments in pnpm-workspace.yaml before merging one.
#   `@enfect/oxlint` is not in it: it takes `@oxlint/plugins` at a caret
#   range, so it runs on whichever oxlint vite-plus pins.
# - `effect`: the Effect 4 line is lockstep-versioned and a runtime singleton.
# - `svelte`: Svelte, SvelteKit and svelte-check / svelte2tsx track each
#   other's compiler versions.
#
# Hand moves (Dependabot cannot make them; do them on the `toolchain` PR's
# branch, then `pnpm install`):
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core@…`,
#   must equal `vite-plus`), `typescript` (`npm:@typescript/typescript6@…`) and
#   `@typescript/native` (`npm:typescript@…`, must be in `@effect/tsgo`'s
#   `components` table) — when a `vite-plus` bump outruns `@effect/tsgo`, pick
#   the `@effect/tsgo` release that supports the new oxlint / tsgolint by hand;
# - `oxlint`, `oxfmt` and `oxlint-tsgolint` are transitive pins of `vite-plus`
#   (they move when it does);
# - the `overrides` entries (`vite@*`, `vitest@*`, `effect`) all point at
#   `catalog:`, so they follow their catalog entry.
# - the `ghcr.io/voidzero-dev/vite-plus:<tag>` image in .devcontainer/devcontainer.json:
#   it equals the catalog's `vite-plus` pin, moved on the toolchain PR.
# See AGENTS.md "Common pitfalls".
#
# `cooldown`: pnpm-workspace.yaml's `minimumReleaseAge` is 8 hours (480
# minutes), but Dependabot's cooldown takes whole days only, so it is 1 day —
# longer than pnpm's guard, so a Dependabot PR never proposes a version pnpm
# would still refuse to install. Same `@thomasfosterau/*` exemption as
# `minimumReleaseAgeExclude`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins vitest / oxlint exactly; effect-tsgo's patch has a hard
      # compatibility table (header).
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
        update-types: ["major", "minor", "patch"]
      # One release train; a split bump installs two copies of `effect`.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
        update-types: ["major", "minor", "patch"]
      # The compiler, Kit and the checkers that embed its version.
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
          - "svelte2tsx"
        update-types: ["major", "minor", "patch"]
    assignees:
      - thomasfosterau
  - package-ecosystem: "github-actions"
    # The composite setup action pins actions too; list it explicitly.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
  # The dev container's features (.devcontainer/devcontainer.json) and their
  # lockfile. The base image tag is not a feature: it is the catalog's
  # `vite-plus` pin, moved by hand on the toolchain PR.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau