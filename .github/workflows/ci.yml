name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  # The job id is the check name; keep it stable.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs with --frozen-lockfile: a stale pnpm-lock.yaml fails here.
      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Build first: `packages/svelte` imports `@thomasfosterau/effect-forms`
      # through its public `exports`, which point at `dist/`. Type-checking and
      # testing it on a clean checkout both need the sibling's build output.
      - name: Build
        run: vp run -r build

      - name: Check (format, lint, types)
        run: vp check

      # Every package's `check` task: svelte-check over `packages/svelte`.
      # Not `vp run -r check`: `-r` also selects the root `check` script
      # (`vp check`), which has no build dependency and so runs while the
      # `check` task's `build` dependency rewrites `packages/forms/dist`.
      - name: Check (svelte-check)
        run: vp run --filter './packages/*' check

      - name: Test
        run: vp run -r test
