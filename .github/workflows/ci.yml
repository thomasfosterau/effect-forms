name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  # The job id is the check name; keep it stable.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs with --frozen-lockfile: a stale pnpm-lock.yaml fails here.
      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Build first: `packages/svelte` imports `@thomasfosterau/effect-forms`
      # through its public `exports`, which point at `dist/`. Type-checking and
      # testing it on a clean checkout both need the sibling's build output.
      - name: Build
        run: vp run -r build

      # The root `check` task (`vp check`: format, lint, types) plus every
      # package's `check` task (svelte-check over `packages/svelte`). Both
      # depend on the packages' `build`, which the Build step left cached.
      - name: Check (format, lint, types, svelte-check)
        run: vp run -r check

      - name: Test
        run: vp run -r test
