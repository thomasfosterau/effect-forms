name: CI

# ONE required job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` and `docgen` tasks and every package's
# `check` / `test:unit` / `build`), not in GitHub Actions `needs:`. Shaped like
# the effect-web library's CI. Nothing here needs a database, a stage or a
# credential, so every PR runs the whole gate, in AGENTS.md "Verification"
# order. Hardened for Dependabot PRs: no permissions beyond `contents: read`,
# no secrets, actions locked by .github/workflows/actions.lock, `persist-credentials: false`, and no
# `$GITHUB_PATH` writes (bins run through `pnpm exec`); checked with zizmor.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  # The job id is the check name; keep it stable.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Installs with --frozen-lockfile: a stale pnpm-lock.yaml fails here.
      - name: Setup toolchain
        uses: $/.github/actions/setup

      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      - name: Format and lint
        run: pnpm exec vp check

      # Every package's native, Effect-patched `tsc` (plus svelte-check over
      # packages/svelte) and the root config. packages/svelte resolves the core
      # through its `exports` (→ `dist/`), so this builds the core first.
      - name: Type gate
        run: pnpm exec vp run check

      - name: Unit tests
        run: pnpm exec vp run -r test:unit

      - name: Build
        run: pnpm exec vp run -r build

      # Type-checks AND runs every JSDoc @example against the built dist/.
      - name: Verify documentation examples (docgen)
        run: pnpm exec vp run docgen

      - name: Audit
        run: pnpm audit --audit-level high
