name: CI

# ONE required job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` and `docgen` tasks and every package's
# `check` / `test:unit` / `build`), not in GitHub Actions `needs:`. Shaped like
# the effect-web library's CI. Nothing here needs a database, a stage or a
# credential, so every PR runs the whole gate, in AGENTS.md "Verification"
# order. Hardened for Dependabot PRs: no permissions beyond `contents: read`,
# no secrets, pinned actions, `persist-credentials: false`, and no
# `$GITHUB_PATH` writes of our own; checked with zizmor.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  # The job id is the check name; keep it stable.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ at the catalog's `vite-plus` pin, the Node.js it manages, the
      # `packageManager` pnpm, and the dependency cache. --frozen-lockfile
      # fails on a stale pnpm-lock.yaml; --ignore-scripts blocks dependency
      # lifecycle scripts (a common supply-chain vector).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            args: ["--frozen-lockfile", "--ignore-scripts"]

      # The one lifecycle script that does run: ours (`vp config` and
      # `effect-tsgo patch --typescript --oxlint`), first-party and on its own
      # line rather than smuggled in by dropping --ignore-scripts.
      - name: Patch the toolchain (repository `prepare` script)
        run: pnpm run prepare

      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      - name: Format and lint
        run: vp check

      # Every package's native, Effect-patched `tsc` (plus svelte-check over
      # packages/svelte) and the root config. packages/svelte resolves the core
      # through its `exports` (→ `dist/`), so this builds the core first.
      - name: Type gate
        run: vp run check

      - name: Unit tests
        run: vp run -r test:unit

      - name: Build
        run: vp run -r build

      # Type-checks AND runs every JSDoc @example against the built dist/.
      - name: Verify documentation examples (docgen)
        run: vp run docgen

      - name: Audit
        run: pnpm audit --audit-level high
