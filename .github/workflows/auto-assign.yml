name: Auto-assign

# Assigns every new pull request to the owner, so it lands in their queue.
# `pull_request`, not `pull_request_target`: no checkout and no third-party
# action, and the one step only edits the PR through `gh`. Skipped when the PR
# already has an assignee, comes from Dependabot (its own `assignees:` in
# .github/dependabot.yml covers it, and its `GITHUB_TOKEN` is read-only), or
# comes from a fork (whose `GITHUB_TOKEN` is read-only too).

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  assign:
    if: >-
      github.event.pull_request.assignees[0] == null &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
