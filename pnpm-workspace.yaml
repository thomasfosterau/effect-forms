# pnpm workspace for the effect-forms package family.
#
# Two published packages:
#   - packages/forms   -> @thomasfosterau/effect-forms         (framework-neutral core)
#   - packages/svelte  -> @thomasfosterau/effect-forms-svelte  (Svelte 5 runes bindings)
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:^` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — CI
# installs with `--frozen-lockfile`, so a stale lockfile fails it at once.
#
# The shape is the library standard (effect-drizzle-ext / effect-jsonapi).
packages:
  - "packages/*"

catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.3
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` and the
  # `oxlint` that vite-plus carries with Effect-patched builds matched by
  # gitHead / version, so this pins in lockstep with `@typescript/native` and
  # `vite-plus` below. Each release ships artifacts for an explicit set of
  # component versions and hard-errors (UnsupportedTargetPackageVersionError)
  # on anything else, failing `pnpm install` itself. Read the `components`
  # table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping
  # any of the three.
  "@effect/tsgo": 0.46.1
  # The SvelteKit the three consuming applications run; only the `/kit` entry
  # of effect-forms-svelte imports it (an optional peer, see `catalogs.peers`).
  "@sveltejs/kit": 3.0.0
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  # Type-only: the `/kit` entry routes a command failure's JSON:API error
  # objects by effect-jsonapi's `Document.ErrorObject` shape (an optional
  # peer). Nothing imports it at runtime.
  "@thomasfosterau/effect-jsonapi": ^0.16.3
  "@types/node": ^26.6.3
  # TypeScript 7 (the native Go compiler; bin `tsc`) is the type checker of
  # record. Pinned exact, alongside the TS6 alias below.
  "@typescript/native": "npm:typescript@7.0.2"
  # The development copy only. The published packages declare the peer range
  # under `catalogs.peers` below; the floor is rc.118; this pin is the 4.0.0 release the suite runs against.
  effect: 4.0.0
  happy-dom: ^20.14.5
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  # TypeScript 6/7 side-by-side: TS7 ships no JavaScript compiler API until
  # 7.1, so everything that `require("typescript")` — svelte-check, the Effect
  # language service patch and tsdown's declaration emit — stays on TS6, kept
  # importable under the `typescript` name through this alias (bin `tsc6`).
  # `@typescript/native` above is TS7 (bin `tsc`), whose gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions; `vite` is
  # the same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin because the `vitest: "catalog:"` override forces
  # every resolution to the catalog singleton.
  vite-plus: 0.3.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vitest: 4.1.11

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest — which is why the release publishes with pnpm, not npm.
catalogs:
  peers:
    "@sveltejs/kit": ^3.0.0
    "@thomasfosterau/effect-jsonapi": ">=0.16.0"
    effect: ">=4.0.0-rc.118"
    svelte: ^5.40.0

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"

allowBuilds:
  esbuild: true
  # Only an optional perf accelerator for msgpackr (pulled in transitively by
  # the Vite+ toolchain); the pure-JS fallback is used when it isn't built.
  msgpackr-extract: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
