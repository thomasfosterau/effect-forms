# pnpm workspace for the effect-forms package family.
#
# Two published packages:
#   - packages/forms   -> @thomasfosterau/effect-forms         (framework-neutral core)
#   - packages/svelte  -> @thomasfosterau/effect-forms-svelte  (Svelte 5 runes bindings)
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:^` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — CI
# installs with `--frozen-lockfile`, so a stale lockfile fails it at once.
#
# The shape is the library standard (effect-drizzle-ext / effect-jsonapi).
packages:
  - "packages/*"

catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  # Compiles AND RUNS every JSDoc `@example` (the `docgen` task); needs `tsx`
  # and a TypeScript JS API — the TS6 alias below satisfies its peer.
  "@effect/docgen": ^4.1.4
  "@effect/language-service": ^0.87.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` and the
  # `oxlint` / `oxlint-tsgolint` that vite-plus carries with Effect-patched
  # builds matched by gitHead / version, so this pins in lockstep with
  # `@typescript/native` and `vite-plus` below (0.67.7 ships against
  # typescript 7.0.2, oxlint 1.88.0 – 1.90.0 and tsgolint 7.0.2004 / 7.0.2005;
  # vite-plus 1.6.0 carries oxlint 1.93.0 and tsgolint 7.0.2006). Each release
  # hard-errors (UnsupportedTargetPackageVersionError) on any other component
  # version, failing `pnpm install` itself. Read the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping any of the
  # three.
  "@effect/tsgo": 0.67.7
  # `it.effect` / `it.layer` / `layer` for the Effect-running tests (owner
  # decision, #161): each test runs on @effect/vitest's harness, with the
  # TestClock and friends provided, instead of `Effect.run*` in a test body.
  # Releases track `effect` one-for-one and peer on `effect: ^<same>`, so it
  # moves with the `effect` pin below (Dependabot's `effect` group). It peers
  # on `vitest >=5 <6` and imports `vitest`, which the `vitest@*` override
  # resolves to the copy `vite-plus/test` re-exports: one runner instance.
  "@effect/vitest": 4.1.3
  # The Effect rule set for Oxlint (the successor of
  # `@mpsuesser/oxlint-plugin-effect`, same `effect/` rule namespace), wired in
  # the root vite.config.ts as `effect.configs.recommended`. It loads into the
  # oxlint vite-plus carries, so it moves with the toolchain set. Its own
  # `effect` dependency (4.1.0) resolves to the catalog singleton through the
  # `effect: "catalog:"` override below; it lints fine on that copy.
  "@enfect/oxlint": 0.10.0
  # The SvelteKit the three consuming applications run; only the `/kit` entry
  # of effect-forms-svelte imports it (an optional peer, see `catalogs.peers`).
  "@sveltejs/kit": 3.2.0
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  # Type-only: the `/kit` entry routes a command failure's JSON:API error
  # objects by effect-jsonapi's `Document.ErrorObject` shape (an optional
  # peer). Nothing imports it at runtime.
  "@thomasfosterau/effect-jsonapi": ^0.21.0
  # The tagged `TriState` (Assign / Clear / CarryForward) that effect-forms'
  # `Coerce` and `Command` return for partial-update fields, imported from its
  # `/TriState` subpath (a required peer of both packages, see `catalogs.peers`).
  "@thomasfosterau/effect-ext": ^0.2.0
  "@types/node": ^26.6.6
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.1.0
  # TypeScript 7 (the native Go compiler; bin `tsc`) is the type checker of
  # record. Pinned exact, alongside the TS6 alias below.
  "@typescript/native": "npm:typescript@7.0.2"
  # The development copy only: the suite runs against this pin and nothing
  # else. The published peer range lives under `catalogs.peers` below, and the
  # suite does not test that floor. `@effect/vitest` above moves with it.
  effect: 4.1.3
  # The dead-code / boundary / complexity audit (`.fallowrc.json`) behind the
  # agent PreToolUse gate; `fallow audit` reads the `test:coverage` map.
  fallow: 3.42.0
  happy-dom: ^21.0.4
  svelte: ^5.57.3
  svelte-check: ^4.7.8
  # TypeScript 6/7 side-by-side: TS7 ships no JavaScript compiler API until
  # 7.1, so everything that `require("typescript")` — svelte-check, the Effect
  # language service patch and tsdown's declaration emit — stays on TS6, kept
  # importable under the `typescript` name through this alias (bin `tsc6`).
  # `@typescript/native` above is TS7 (bin `tsc`), whose gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  # Exists only for `@effect/docgen`, which peers on it and spawns the `tsx`
  # binary itself to run its compiled examples. Scripts run with `vpx`.
  tsx: ^4.23.15
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.6.0 carries oxlint 1.93.0,
  # oxfmt 0.78.0, tsgolint 7.0.2006 and vitest 5.1.0. `vite` is the same release under its
  # aliased core package, and `vitest` must match vite-plus's exact pin
  # because the `vitest: "catalog:"` override forces every resolution to the
  # catalog singleton.
  vite-plus: 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest — which is why the release publishes with pnpm, not npm.
#
# The `effect` peer is `^4.0.0` (owner policy): raise it only when a
# dependency requires a newer `effect`, naming that dependency and its range
# here. Neither package has a dependency that does.
#
# `@thomasfosterau/effect-jsonapi` is `>=0.18.0`: the `/kit` entry's
# `CommandFailure.ErrorObject` is its `Document.ErrorObject` type, which
# 0.18.0 first exports (0.16 / 0.17 export only the schema value).
#
# `@thomasfosterau/effect-ext` is `^0.1.0 || ^0.2.0`, a required peer of both
# packages: `Coerce` and `Command` build its `TriState` at runtime, and
# effect-forms-svelte's `defineEntityForm` exposes it through `adaptOverrides`
# (`Command.AdaptOverrides`). 0.1.0 is the first release with the `/TriState`
# subpath, and 0.2.0 ships the same module unchanged. Its own `effect` peer is
# `^4.0.0`, so the `effect` floor above stays.
catalogs:
  peers:
    "@sveltejs/kit": ^3.0.0
    "@thomasfosterau/effect-ext": ^0.1.0 || ^0.2.0
    "@thomasfosterau/effect-jsonapi": ">=0.18.0"
    effect: ^4.0.0
    svelte: ^5.40.0

overrides:
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # Vite+ manages these two (`vp migrate` writes the `@*` keys): every `vite` /
  # `vitest` resolution, transitive ones included, is forced onto the catalog
  # singleton vite-plus carries.
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

allowBuilds:
  esbuild: true
  # Downloads fallow's native binary for this platform.
  fallow: true
  # Only an optional perf accelerator for msgpackr (pulled in transitively by
  # the Vite+ toolchain); the pure-JS fallback is used when it isn't built.
  msgpackr-extract: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149, relaxed to 8 hours on
# 2026-10-30): hold newly published versions for 8 hours (unit: MINUTES)
# before pnpm will install them. Dependabot's `cooldown` (whole days only) is
# 1 day, so it never proposes a version this would still refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
