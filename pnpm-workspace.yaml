# Every external version lives here; package.json files use `catalog:`,
# `catalog:peers` or `workspace:^`. After editing, run `vp install` and commit
# pnpm-lock.yaml. Development runs on the exact `effect` pin; the published
# peers in `catalogs.peers` are ranges, raised only when a dependency needs it.
packages:
  - "packages/*"

catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/docgen": ^4.1.4
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch` (the `prepare` script) supports only the TypeScript and
  # oxlint versions in its `components` table
  # (node_modules/@effect/tsgo/dist/effect-tsgo.cjs) and fails `pnpm install`
  # on any other: it moves with `@typescript/native` and `vite-plus`.
  "@effect/tsgo": 0.69.0
  "@effect/vitest": 4.1.4
  "@enfect/oxlint": 0.10.0
  "@sveltejs/kit": 3.4.0
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  # Type-only, for `/kit`'s `CommandFailure.ErrorObject`.
  "@thomasfosterau/effect-jsonapi": ^0.22.1
  "@thomasfosterau/effect-ext": ^0.3.1
  "@types/node": ^26.6.6
  # Must equal vite-plus's `vitest` pin.
  "@vitest/coverage-istanbul": 5.1.0
  # TypeScript 7 (native, bin `tsc`), the type checker of record.
  "@typescript/native": "npm:typescript@7.0.2"
  effect: 4.1.4
  fallow: 3.43.2
  happy-dom: ^21.0.4
  svelte: ^5.58.0
  svelte-check: ^4.7.8
  # TypeScript 6 under the `typescript` name: svelte-check, the language
  # service, docgen and `vp pack`'s declaration emit need its JS API.
  typescript: "npm:@typescript/typescript6@6.0.2"
  # Only because `@effect/docgen` spawns it to run examples.
  tsx: ^4.23.15
  # `vite` (vite-plus's aliased core) and `vitest` must match vite-plus; see
  # docs/CONTRIBUTING.md for the by-hand toolchain update.
  vite-plus: 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0

# Peer ranges the published packages declare.
# - effect-jsonapi: `>=0.18.0`, the first release exporting `Document.ErrorObject`.
# - effect-ext: from 0.1.0, the first release with the `/TriState` subpath.
catalogs:
  peers:
    "@sveltejs/kit": ^3.0.0
    "@thomasfosterau/effect-ext": ^0.1.0 || ^0.2.0 || ^0.3.0
    "@thomasfosterau/effect-jsonapi": ">=0.18.0"
    effect: ^4.0.0
    svelte: ^5.40.0

overrides:
  # `effect` must be a singleton.
  effect: "catalog:"
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

allowBuilds:
  esbuild: true
  # Downloads fallow's native binary.
  fallow: true
  msgpackr-extract: false

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Hold new versions for 24 hours (minutes), matching Dependabot's 1-day cooldown.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
